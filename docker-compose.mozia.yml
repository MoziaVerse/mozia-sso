version: '3.1'
services:
  mozia-sso:
    image: mozia-sso
    container_name: mozia-sso
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
      target: STANDARD
    entrypoint: /bin/sh -c 'cp /conf/app.mozia.conf /conf/app.conf && ./server --createDatabase=false'
    ports:
      - "${MOZIA_SSO_BIND_LOCAL:-127.0.0.1:8778}:8000"
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      dataSourceName: ${dataSourceName:?set dataSourceName in .env; never commit real database credentials}
      redisEndpoint: ${redisEndpoint:-}
      radiusSecret: ${radiusSecret:-replace_with_radius_secret}
    volumes:
      - ./conf:/conf/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - postgres_db_internal

networks:
  postgres_db_internal:
    external: true
